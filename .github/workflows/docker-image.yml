name: Build & Push Docker

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 登录阿里云镜像仓库
      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 读取 Server Version
      - name: Read Server Version
        id: server
        run: |
          echo "VERSION=$(node -p "require('./apps/server/package.json').version")" >> $GITHUB_OUTPUT

      # 读取 Client Version
      - name: Read Client Version
        id: client
        run: |
          echo "VERSION=$(node -p "require('./apps/client/package.json').version")" >> $GITHUB_OUTPUT

      # Build Server
      - name: Build Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            crpi-vit1t6doo4kal24v.cn-beijing.personal.cr.aliyuncs.com/big0range-demo/vane-server:${{ steps.server.outputs.VERSION }}
            crpi-vit1t6doo4kal24v.cn-beijing.personal.cr.aliyuncs.com/big0range-demo/vane-server:latest

      # Build Client
      - name: Build Client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            crpi-vit1t6doo4kal24v.cn-beijing.personal.cr.aliyuncs.com/big0range-demo/vane-nginx:${{ steps.client.outputs.VERSION }}
            crpi-vit1t6doo4kal24v.cn-beijing.personal.cr.aliyuncs.com/big0range-demo/vane-nginx:latest
