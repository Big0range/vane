name: Build & Push Docker

on:
  push:
    branches:
      - master
env:
  # 镜像仓库配置
  REGISTRY: crpi-vit1t6doo4kal24v.cn-beijing.personal.cr.aliyuncs.com
  NAMESPACE: big0range-demo

  # 镜像名称
  IMAGE_SERVER: vane-server
  IMAGE_CLIENT: vane-nginx

  # 完整镜像名（用于部署脚本）
  FULL_IMAGE_SERVER: crpi-vit1t6doo4kal24v.cn-beijing.personal.cr.aliyuncs.com/big0range-demo/vane-server
  FULL_IMAGE_CLIENT: crpi-vit1t6doo4kal24v.cn-beijing.personal.cr.aliyuncs.com/big0range-demo/vane-nginx

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 登录阿里云镜像仓库
      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 读取 Version
      - name: Read Server Version
        id: vane
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Build Server
      - name: Build Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ env.FULL_IMAGE_SERVER }}:${{ steps.vane.outputs.VERSION }}
            ${{ env.FULL_IMAGE_SERVER }}:latest

      # Build Client
      - name: Build Client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ${{ env.FULL_IMAGE_CLIENT }}:${{ steps.vane.outputs.VERSION }}
            ${{ env.FULL_IMAGE_CLIENT }}:latest
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD  }}
          script: |
            cd /opt/vane
            docker-compose down
            docker-compose pull
            docker-compose up -d
            echo "删除悬空镜像"
            docker images "${{ env.FULL_IMAGE_SERVER }}" --filter "dangling=true" -q | xargs -r docker rmi
            docker images "${{ env.FULL_IMAGE_CLIENT }}" --filter "dangling=true" -q | xargs -r docker rmi
